# /etc/nginx/sites-available/fusion-ui  (symlink into sites-enabled)
#
# TLS and the shared password terminate here. The `Upgrade`/`Connection`
# headers are not optional: Streamlit talks over a websocket, and a proxy that
# drops them serves a page that loads and then hangs forever with no error.

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/fusion-ui.crt;
    ssl_certificate_key /etc/nginx/ssl/fusion-ui.key;

    # Movies and netCDF exports.
    client_max_body_size 64m;

    location / {
        auth_basic           "Shot Explorer";
        auth_basic_user_file /etc/nginx/.htpasswd;

        proxy_pass           http://127.0.0.1:8501;
        proxy_http_version   1.1;
        proxy_set_header     Upgrade $http_upgrade;   # Streamlit needs
        proxy_set_header     Connection "upgrade";    # websockets
        proxy_set_header     Host $host;
        proxy_set_header     X-Real-IP $remote_addr;
        proxy_set_header     X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header     X-Forwarded-Proto $scheme;
        proxy_read_timeout   3600s;                   # long analyses
        proxy_send_timeout   3600s;
        proxy_buffering      off;
    }
}
