# /etc/nginx/sites-available/fusion-ui  (symlink into sites-enabled)
#
# TLS and the shared password terminate here. The `Upgrade`/`Connection`
# headers are not optional: Streamlit talks over a websocket, and a proxy that
# drops them serves a page that loads and then hangs forever with no error.

# BEGIN http-redirect -- install.sh removes this block when something else
# (apache, say) already owns port 80. TLS is what matters; the redirect is a
# convenience, and binding 80 is not worth displacing a running service.
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}
# END http-redirect

server {
    # The legacy `http2` listen parameter, because it works on every nginx
    # from 1.9.5 on. install.sh rewrites this to the separate `http2 on;`
    # directive on nginx 1.25.1+, where the parameter is deprecated.
    listen 443 ssl http2;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/fusion-ui.crt;
    ssl_certificate_key /etc/nginx/ssl/fusion-ui.key;

    # Movies and netCDF exports.
    client_max_body_size 64m;

    location / {
        auth_basic           "Shot Explorer";
        auth_basic_user_file /etc/nginx/.htpasswd;

        proxy_pass           http://127.0.0.1:8501;
        proxy_http_version   1.1;
        proxy_set_header     Upgrade $http_upgrade;   # Streamlit needs
        proxy_set_header     Connection "upgrade";    # websockets
        proxy_set_header     Host $host;
        proxy_set_header     X-Real-IP $remote_addr;
        proxy_set_header     X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header     X-Forwarded-Proto $scheme;
        proxy_read_timeout   3600s;                   # long analyses
        proxy_send_timeout   3600s;
        proxy_buffering      off;
    }
}
