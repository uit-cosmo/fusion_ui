# /etc/systemd/system/nginx.service.d/fusion-ui-restart.conf
#
# Ubuntu's nginx unit has Restart=no, so a start that fails stays failed until
# someone notices. On 2026-10-28 an unattended nginx upgrade restarted it while
# apache (upgraded and restarted on 10-15) held port 80, and the whole site was
# down for six days. Keep trying: a port conflict or a missing file can clear up
# without anyone touching nginx, and every retry is logged in the journal.

[Unit]
# No start rate limit, so the retries never stop by themselves.
StartLimitIntervalSec=0

[Service]
Restart=on-failure
RestartSec=30s
