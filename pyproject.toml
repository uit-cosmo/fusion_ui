[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "fusion_ui"
version = "0.1.0"
description = "Shot Explorer: a web UI over the group's fusion diagnostic data"
authors = [
  { name = "Juan Manuel Losada", email = "juan.m.losada@uit.no" }
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.10"
# imaging_methods, experimental_database and fusion_scripts are not on PyPI:
# install each editable from its local checkout (see README).
dependencies = [
    # The Fields page passes a callable to st.download_button(data=...), so the file is built when
    # the button is clicked and not on every rerun. The installed package does not say which
    # release added that, so the floor is the release the laptop and the server run.
    "streamlit>=1.63",
    "plotly>=5.24",
    "xarray>=2025.01.2",
    "netcdf4>=1.7.2",
    "numpy>=1.26.4",
    "scipy>=1.15.1",
    "matplotlib>=3.10.0",
    "pandas>=2.2",
    "imaging_methods>=0.1.0",
    "velocity_estimation>=1.0.0",
    "fppanalysis>=0.2.0",
    "experimental_database>=0.0.1",
    "fusion_scripts>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "black>=24.0",
]

[tool.black]
target-version = ["py310"]

[project.scripts]
fusion-ui = "fusion_ui.cli:main"

[tool.setuptools]
packages = [
    "fusion_ui",
    "fusion_ui.core",
    "fusion_ui.plots",
    "fusion_ui.stats",
    "fusion_ui.views",
]

[tool.setuptools.package-data]
# The hand-written prose the pages read: the run-day summaries, and the dead-pixel summary in plain words.
fusion_ui = ["data/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: runs a real analysis end to end (every cached spec's round trip through the cache, a pool of workers); skip with -m 'not slow' for a quick run.",
]
